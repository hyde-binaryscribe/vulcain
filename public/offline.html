<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hors ligne — Vulkain</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: #12161C; color: #E8EAED;
            font-family: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            text-align: center;
        }
        .card { max-width: 24rem; }
        .emblem {
            width: 72px; height: 72px; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 18px; background: rgba(198, 54, 43, 0.15);
            border: 1px solid rgba(198, 54, 43, 0.35);
        }
        .emblem img { width: 44px; height: 44px; }
        h1 {
            font-family: "Archivo", system-ui, sans-serif;
            font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: -0.01em;
        }
        p { margin: 0 0 1.75rem; color: #9AA1AC; line-height: 1.5; font-size: 0.95rem; }
        button {
            appearance: none; border: 0; cursor: pointer;
            background: #C6362B; color: #fff;
            font: inherit; font-weight: 600;
            padding: 0.75rem 1.5rem; border-radius: 0.75rem;
            transition: filter 0.15s;
        }
        button:hover { filter: brightness(1.1); }
        .hint { margin-top: 1.25rem; font-size: 0.8rem; color: #6B7280; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emblem"><img src="/favicon.svg" alt="Vulkain"></div>
        <h1>Vous êtes hors ligne</h1>
        <p>Vulkain a besoin d'une connexion pour afficher cette page. Vérifiez votre réseau, puis réessayez.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
        <p class="hint">Les pages déjà chargées restent accessibles dans l'application.</p>
    </div>
</body>
</html>
